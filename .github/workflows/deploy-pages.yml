name: Deploy research article to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch canonical preprint PDF from Zenodo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import urllib.parse
          import urllib.request

          RECORD_ID = "21903347"
          API_URL = f"https://zenodo.org/api/records/{RECORD_ID}"
          OUTPUT = pathlib.Path(
              "app/public/mitigating-shortcut-learning-in-brain-tumour-mri-classification.pdf"
          )
          MAX_SCHOLAR_PDF_BYTES = 5 * 1024 * 1024
          HEADERS = {"User-Agent": "pfd-gste-research-article-pages/1.0"}

          def get_json(url, timeout=60):
              request = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  return json.load(response)

          # Zenodo is backed by InvenioRDM. Published files are exposed through
          # GET /api/records/{id}/files; each entry then has a /content endpoint.
          record = get_json(API_URL)
          files_url = (record.get("links") or {}).get("files") or f"{API_URL}/files"
          files_payload = get_json(files_url)
          files = files_payload.get("entries") or []

          pdfs = [
              item
              for item in files
              if str(item.get("key") or "").lower().endswith(".pdf")
          ]
          if len(pdfs) != 1:
              names = [str(item.get("key") or "") for item in files]
              raise RuntimeError(
                  f"Expected exactly one PDF in Zenodo record {RECORD_ID}; "
                  f"found {len(pdfs)}. Files: {names}"
              )

          pdf = pdfs[0]
          key = str(pdf.get("key") or "")
          links = pdf.get("links") or {}
          download_url = links.get("content")
          if download_url:
              download_url = urllib.parse.urljoin("https://zenodo.org", download_url)
          else:
              quoted_key = urllib.parse.quote(key, safe="")
              download_url = f"{API_URL}/files/{quoted_key}/content"

          OUTPUT.parent.mkdir(parents=True, exist_ok=True)
          temporary = OUTPUT.with_suffix(".pdf.part")
          download_request = urllib.request.Request(download_url, headers=HEADERS)
          with urllib.request.urlopen(download_request, timeout=180) as source:
              with temporary.open("wb") as destination:
                  shutil.copyfileobj(source, destination)

          size = temporary.stat().st_size
          if size <= 0:
              raise RuntimeError("Downloaded Zenodo PDF is empty")
          if size > MAX_SCHOLAR_PDF_BYTES:
              raise RuntimeError(
                  f"Downloaded PDF is {size} bytes, above Google Scholar's 5 MB limit"
              )
          with temporary.open("rb") as handle:
              if handle.read(5) != b"%PDF-":
                  raise RuntimeError("Downloaded file does not have a PDF header")

          checksum = str(pdf.get("checksum") or "")
          if ":" in checksum:
              algorithm, expected = checksum.split(":", 1)
              algorithm = algorithm.lower()
              if algorithm in hashlib.algorithms_available:
                  digest = hashlib.new(algorithm)
                  with temporary.open("rb") as handle:
                      for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                          digest.update(chunk)
                  actual = digest.hexdigest()
                  if actual.lower() != expected.lower():
                      raise RuntimeError(
                          f"Zenodo checksum mismatch: expected {checksum}, "
                          f"got {algorithm}:{actual}"
                      )

          temporary.replace(OUTPUT)
          print(
              f"Published {OUTPUT} from Zenodo record {RECORD_ID} "
              f"({size} bytes; source={download_url})"
          )
          PY

      - name: Install, build, and upload article
        uses: withastro/action@v6
        with:
          path: ./app
          node-version: 20
          package-manager: npm@latest
          build-cmd: npm run build
        env:
          GITHUB_PAGES: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
